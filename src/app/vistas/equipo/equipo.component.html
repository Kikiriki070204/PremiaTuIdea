<div class="min-h-screen flex items-start justify-center pt-16 px-4">
  <div class="w-full max-w-md bg-white border border-gray-200 rounded-xl shadow-md p-8">

    <h5 class="text-center mb-6 text-3xl font-bold text-blue-900">
      ¿Deseas agregar colaboradores?
    </h5>

    <div class="flex justify-center gap-3">
      <button
        (click)="showModal = true"
        type="button"
        class="text-white bg-blue-800 hover:bg-blue-900 font-medium rounded-lg text-sm px-6 py-2.5 transition duration-200">
        Sí
      </button>
      <button
        (click)="goBack()"
        type="button"
        class="text-white bg-red-600 hover:bg-red-700 font-medium rounded-lg text-sm px-6 py-2.5 transition duration-200">
        No
      </button>
    </div>
  </div>
</div>

<!-- Modal con overlay Angular (sin Flowbite) -->
<div *ngIf="showModal"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
  <div class="relative bg-white rounded-xl shadow-xl w-full max-w-md mx-4 max-h-[90vh] flex flex-col">

    <!-- Header -->
    <div class="flex items-center justify-between p-5 border-b">
      <h3 class="text-lg font-semibold text-gray-900">Agregar colaboradores</h3>
      <button
        type="button"
        (click)="showModal = false"
        class="text-gray-400 hover:bg-gray-100 hover:text-gray-900 rounded-lg w-8 h-8 flex items-center justify-center transition">
        <svg class="w-3 h-3" fill="none" viewBox="0 0 14 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
        </svg>
      </button>
    </div>

    <!-- Buscador -->
    <div class="p-4 border-b">
      <input
        (input)="inputChanged($event)"
        type="text"
        class="border rounded-lg p-2 w-full text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
        placeholder="Buscar colaborador…" />
    </div>

    <!-- Lista scrollable -->
    <div class="overflow-y-auto flex-1 p-4 space-y-2" style="max-height:240px">
      <ng-container *ngIf="colaboradores.length > 0; else empty">
        <div *ngFor="let colaborador of colaboradores" class="flex items-center gap-2">
          <input
            type="checkbox"
            [checked]="checkboxStates[colaborador.id] || false"
            (change)="checkboxChanged(colaborador.id, $event)"
            class="w-4 h-4 accent-blue-800" />
          <label class="text-sm text-gray-700">{{ colaborador.nombre }}</label>
        </div>
      </ng-container>
      <ng-template #empty>
        <p class="text-sm text-gray-500 text-center py-4">No hay colaboradores disponibles</p>
      </ng-template>
    </div>

    <!-- Footer -->
    <div class="p-4 border-t flex justify-end gap-2">
      <button
        type="button"
        (click)="showModal = false"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition">
        Cancelar
      </button>
      <button
        (click)="agregarColab()"
        type="button"
        class="flex items-center gap-1 px-5 py-2 text-sm font-semibold text-white bg-blue-800 hover:bg-blue-900 rounded-lg transition">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd"
            d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
            clip-rule="evenodd"/>
        </svg>
        Guardar
      </button>
    </div>
  </div>
</div>
