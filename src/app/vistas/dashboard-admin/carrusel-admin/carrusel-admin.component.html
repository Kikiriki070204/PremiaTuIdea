<div class="p-6 max-w-4xl mx-auto">
  <h2 class="text-2xl font-bold text-blue-900 mb-6">Carrusel de imágenes</h2>

  <!-- Upload -->
  <div class="bg-white border border-gray-200 rounded-xl p-5 mb-6 shadow-sm">
    <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-3">Subir nueva imagen</h3>
    <label
      class="flex flex-col items-center justify-center w-full h-36 border-2 border-dashed border-blue-300 rounded-xl cursor-pointer bg-blue-50 hover:bg-blue-100 transition-colors duration-200">
      <svg class="w-8 h-8 text-blue-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span class="text-sm text-blue-600 font-medium">
        {{ uploading ? 'Subiendo...' : 'Haz clic para seleccionar imagen' }}
      </span>
      <span class="text-xs text-gray-400 mt-1">JPG, PNG, WEBP · máx. 4 MB</span>
      <input type="file" class="hidden" accept="image/jpeg,image/png,image/jpg,image/webp"
        (change)="onFileSelected($event)" [disabled]="uploading" />
    </label>
    @if(error) {
      <p class="mt-2 text-sm text-red-600">{{ error }}</p>
    }
  </div>

  <!-- Grid de imágenes -->
  @if(imagenes.length === 0) {
    <div class="flex flex-col items-center justify-center py-16 text-center bg-white border border-gray-200 rounded-xl">
      <svg class="w-12 h-12 text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <p class="text-gray-400 font-medium">No hay imágenes en el carrusel</p>
    </div>
  } @else {
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
      @for(img of imagenes; track img.id) {
        <div class="rounded-xl overflow-hidden border border-gray-200 shadow-sm bg-white">
          <img [src]="imageUrl(img.id)" class="w-full h-40 object-cover" alt="Imagen carrusel" />
          <div class="flex items-center justify-between px-3 py-2">
            <span class="text-xs text-gray-400">Imagen #{{ img.id }}</span>
            <button (click)="delete(img.id)"
              class="flex items-center gap-1 text-xs font-semibold text-red-600 hover:text-red-800 transition-colors duration-200">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
              Eliminar
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>
