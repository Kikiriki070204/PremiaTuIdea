<div class="login-page">

  <!-- Panel izquierdo (decorativo) -->
  <div class="brand-panel">
    <div class="brand-glow"></div>
    <div class="brand-content">
      <img src="assets/logoWhite.png" alt="PremiaTuIdea" class="brand-logo" />
      <h2 class="brand-headline">Premia tu esfuerzo,<br/>impulsa tu talento.</h2>
      <p class="brand-desc">Plataforma interna de reconocimiento BorgWarner</p>
    </div>
    <div class="brand-circles">
      <span class="circle c1"></span>
      <span class="circle c2"></span>
      <span class="circle c3"></span>
    </div>
  </div>

  <!-- Panel derecho (formulario) -->
  <div class="form-panel">
    <div class="form-card">

      <div class="form-header">
        <img src="assets/borgwarner_logo.png" alt="BorgWarner" class="form-logo" />
        <h1 class="form-title">Bienvenido</h1>
        <p class="form-subtitle">Ingresa tus credenciales para acceder</p>
      </div>

      <!-- IBM -->
      <div class="field-group">
        <label for="ibm" class="field-label">IBM</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4"/>
            </svg>
          </span>
          <input
            [formControl]="ibm"
            type="number"
            name="ibm"
            id="ibm"
            class="field-input"
            placeholder="Tu número IBM"
            autocomplete="off"
            (keydown.enter)="login()"
          />
        </div>
      </div>

      <!-- Contraseña -->
      <div class="field-group">
        <label for="password" class="field-label">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2"/>
            </svg>
          </span>
          <input
            [formControl]="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            id="password"
            class="field-input has-eye"
            placeholder="Tu contraseña"
            (keydown.enter)="login()"
          />
          <button type="button" class="eye-btn" (click)="togglePasswordVisibility()" tabindex="-1">
            @if (!showPassword) {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
              <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
              <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/>
            </svg>
            } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
              <path d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474l-2.06-2.06C.938 6.278 0 8 0 8s3 5.5 8 5.5a7 7 0 0 0 2.79-.588M5.21 3.088A7 7 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.062-2.062a3.5 3.5 0 0 0-4.474-4.474z"/>
              <path d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6-12-12 .708-.708 12 12z"/>
            </svg>
            }
          </button>
        </div>
      </div>

      <!-- Error -->
      @if (errorMessage) {
      <div class="error-alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
      }

      <!-- Botón login -->
      @if (!cargando) {
      <button (click)="login()" class="btn-login">
        <span class="btn-text">Iniciar sesión</span>
        <span class="btn-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8"/>
          </svg>
        </span>
      </button>
      } @else {
      <button class="btn-loading" disabled>
        <span class="spinner"></span>
        <span>Iniciando sesión...</span>
      </button>
      }

      <!-- Divider -->
      <div class="divider"><span>¿No tienes cuenta?</span></div>

      <!-- Link registro -->
      <a [routerLink]="['/register']" class="btn-register">
        Crear nueva cuenta
      </a>

    </div>
  </div>

</div>
