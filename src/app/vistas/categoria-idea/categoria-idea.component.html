<div class="min-h-screen bg-gray-50 flex flex-col items-center justify-center px-4 py-10">
  <div class="w-full max-w-2xl">

    <!-- Header -->
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-blue-900 mb-2">Origen de mejora</h2>
      <p class="text-gray-500 text-sm">Selecciona el tipo de origen de tu idea o proyecto para continuar</p>
    </div>

    <!-- Option cards grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6">
      <button *ngFor="let opcion of opciones"
        (click)="seleccionar(opcion.id)"
        [ngClass]="opcionSeleccionada === opcion.id
          ? 'bg-blue-900 text-white border-blue-900 shadow-md ring-2 ring-blue-300'
          : 'bg-white text-gray-700 border-gray-200 hover:border-blue-300 hover:shadow-sm hover:text-blue-900'"
        class="flex flex-col items-center justify-center text-center px-3 py-5 rounded-xl border-2 font-medium text-sm h-24 gap-1.5 cursor-pointer">
        <!-- Check icon when selected -->
        <svg *ngIf="opcionSeleccionada === opcion.id" class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd"
            d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
            clip-rule="evenodd" />
        </svg>
        <span>{{ opcion.nombre }}</span>
      </button>
    </div>

    <!-- Error message -->
    @if (errorMessage) {
      <p class="text-red-600 text-sm text-center mb-5">{{ errorMessage }}</p>
    }

    <!-- Actions -->
    <div class="flex gap-3 justify-center">
      <button (click)="irASiguiente()"
        class="px-8 py-2.5 bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-lg text-sm shadow transition">
        Siguiente
      </button>
      <button (click)="irAtras()"
        class="px-8 py-2.5 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg text-sm shadow transition">
        Cancelar
      </button>
    </div>

  </div>
</div>
