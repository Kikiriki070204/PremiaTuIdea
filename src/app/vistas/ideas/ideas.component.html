<div class="max-w-5xl mx-auto px-4 pt-8 pb-4">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
    <div>
      <h1 class="text-3xl font-bold text-blue-900">Tus Ideas / Proyectos</h1>
      <p class="text-sm text-gray-500 mt-1">Gestiona y da seguimiento a tus propuestas de mejora</p>
    </div>
    <a [routerLink]="['/categoriaIdea']"
      class="inline-flex items-center gap-2 bg-blue-900 hover:bg-blue-800 text-white font-semibold text-sm px-5 py-2.5 rounded-lg shadow transition shrink-0">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd"
          d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
          clip-rule="evenodd" />
      </svg>
      Nueva Idea / Proyecto
    </a>
  </div>

  <!-- Tabs -->
  <div class="flex gap-0 border-b border-gray-200 mb-6 overflow-x-auto">
    <button [routerLink]="['revision']"
      routerLinkActive="border-b-2 border-amber-500 text-amber-600 font-semibold bg-amber-50"
      [routerLinkActiveOptions]="{ exact: true }"
      class="px-5 py-3 text-sm font-medium text-gray-500 hover:text-amber-500 hover:bg-amber-50 whitespace-nowrap rounded-t-lg transition">
      En Revisión
    </button>
    <button [routerLink]="['aceptadas']"
      routerLinkActive="border-b-2 border-green-500 text-green-600 font-semibold bg-green-50"
      [routerLinkActiveOptions]="{ exact: true }"
      class="px-5 py-3 text-sm font-medium text-gray-500 hover:text-green-600 hover:bg-green-50 whitespace-nowrap rounded-t-lg transition">
      Aceptadas
    </button>
    <button [routerLink]="['implementadas']"
      routerLinkActive="border-b-2 border-blue-600 text-blue-700 font-semibold bg-blue-50"
      [routerLinkActiveOptions]="{ exact: true }"
      class="px-5 py-3 text-sm font-medium text-gray-500 hover:text-blue-700 hover:bg-blue-50 whitespace-nowrap rounded-t-lg transition">
      Implementadas
    </button>
    <button [routerLink]="['rechazadas']"
      routerLinkActive="border-b-2 border-red-600 text-red-600 font-semibold bg-red-50"
      [routerLinkActiveOptions]="{ exact: true }"
      class="px-5 py-3 text-sm font-medium text-gray-500 hover:text-red-600 hover:bg-red-50 whitespace-nowrap rounded-t-lg transition">
      Rechazadas
    </button>
  </div>

  <router-outlet></router-outlet>
</div>
