<!-- Cards grid -->
<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
  <a *ngFor="let idea of ideas?.data"
    [routerLink]="['/idea/', idea.id]"
    class="block bg-white border border-gray-200 rounded-xl p-5 shadow-sm hover:shadow-md hover:border-green-300 group cursor-pointer no-underline">
    <div class="flex items-start justify-between gap-2 mb-3">
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-700">
        Aceptada
      </span>
      <svg class="w-4 h-4 text-gray-300 group-hover:text-green-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </div>
    <p class="text-sm font-semibold text-gray-800 leading-snug">{{ idea.titulo }}</p>
  </a>
</div>

<!-- Empty state -->
@if (!ideas?.data || ideas.data.length === 0) {
  <div class="flex flex-col items-center justify-center py-16 text-center">
    <svg class="w-12 h-12 text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
    </svg>
    <p class="text-gray-400 text-sm font-medium">No hay ideas aceptadas</p>
  </div>
}

<!-- Pagination -->
<div class="flex items-center justify-between mt-6 pt-4 border-t border-gray-100" *ngIf="ideas?.data?.length > 0">
  <span class="text-xs text-gray-500">
    {{ (ideas.current_page - 1) * ideas.per_page + 1 }}–{{ Math.min(ideas.current_page * ideas.per_page, ideas.total) }}
    de {{ ideas.total }} ideas
  </span>
  <div class="flex items-center gap-1">
    <button (click)="misIdeas(2, ideas.current_page - 1)"
      [disabled]="ideas.current_page === 1"
      class="p-1.5 rounded-lg text-gray-500 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed transition">
      <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M11.78 5.22a.75.75 0 0 1 0 1.06L8.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"
          clip-rule="evenodd" />
      </svg>
    </button>
    <span class="text-xs font-medium text-gray-700 px-2">{{ ideas.current_page }} / {{ ideas.last_page }}</span>
    <button (click)="misIdeas(2, ideas.current_page + 1)"
      [disabled]="ideas.current_page === ideas.last_page"
      class="p-1.5 rounded-lg text-gray-500 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed transition">
      <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z"
          clip-rule="evenodd" />
      </svg>
    </button>
  </div>
</div>
