@if(visible && anuncio) {
<div class="an-backdrop" (click)="cerrar()">
  <div class="an-card" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="an-header">
      <div class="an-orb an-orb1"></div>
      <div class="an-orb an-orb2"></div>

      <div class="an-header-content">
        <span class="an-badge">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor" viewBox="0 0 16 16">
            <path d="M13 2.5a1.5 1.5 0 0 1 3 0v11a1.5 1.5 0 0 1-3 0v-.214c-2.162-1.241-4.49-1.843-6.912-2.083l.405 2.712A1 1 0 0 1 5.51 15.1h-.548a1 1 0 0 1-.916-.599l-1.85-3.49-.202-.003A2.014 2.014 0 0 1 0 9V8a2.014 2.014 0 0 1 1.994-2.014 69 69 0 0 0 .538-.033 71 71 0 0 0-.316-.04A1 1 0 0 1 3 4.82V4a2 2 0 0 1 2-2h1c2.49 0 4.906.59 7 1.655z"/>
          </svg>
          Comunicado
        </span>
        <h2 class="an-title">Aviso importante</h2>
      </div>

      <button class="an-close" (click)="cerrar()" title="Cerrar">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
          <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
        </svg>
      </button>
    </div>

    <!-- Cuerpo -->
    <div class="an-body">
      <div class="an-icon-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
          <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2"/>
        </svg>
      </div>
      <div class="an-msg ql-editor" [innerHTML]="safeHtml"></div>
    </div>

    @if(anuncio.dias > 0) {
    <div class="an-footer">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
        <path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71z"/>
        <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0"/>
      </svg>
      Vigente por {{ anuncio.dias }} día{{ anuncio.dias !== 1 ? 's' : '' }}
    </div>
    }

  </div>
</div>
}
